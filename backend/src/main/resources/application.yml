spring:
  application:
    name: ploa-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ploa}
    username: ${SPRING_DATASOURCE_USERNAME:ploa}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.ploa: DEBUG
  file:
    name: /app/logs/ploa.log

# PLOA application config
ploa:
  security:
    api-key: ${API_SECRET_KEY:changeme-strong-secret}
  health:
    target-weight-kg: ${TARGET_WEIGHT_KG:68.0}
    baseline-window-days: ${BASELINE_WINDOW_DAYS:30}
    sleep-target-hours: ${SLEEP_TARGET_HOURS:7.5}
  finance:
    monthly-budget-vnd: ${MONTHLY_BUDGET_VND:10000000}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    allowed-chat-ids: ${TELEGRAM_ALLOWED_CHAT_IDS:}
  briefing:
    morning-cron: ${MORNING_BRIEFING_CRON:0 30 7 * * *}   # 07:30 AM every day
    evening-cron: ${EVENING_SUMMARY_CRON:0 30 21 * * *}   # 09:30 PM (21:30) every day
