# Cloud profile: uses Gemini 1.5 Flash via OpenAI-compatible endpoint
spring:
  ai:
    model:
      chat: openai
    openai:
      api-key: ${GOOGLE_AI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: ${GEMINI_MODEL:gemini-1.5-flash}
          temperature: 0.2

ploa:
  ai:
    provider: gemini
    vision-model: ${GEMINI_MODEL:gemini-1.5-flash}
    text-model: ${GEMINI_MODEL:gemini-1.5-flash}
