services:

  postgres:
    image: postgres:16-alpine
    container_name: ploa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ploa}
      POSTGRES_USER: ${POSTGRES_USER:-ploa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ploa} -d ${POSTGRES_DB:-ploa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ploa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ploa}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ploa}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      API_SECRET_KEY: ${API_SECRET_KEY:-changeme-strong-secret}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-llama3.2}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-cloud}
    ports:
      - "8080:8080"
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ploa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  garmin-puller:
    build:
      context: ./garmin-puller
      dockerfile: Dockerfile
    container_name: ploa-garmin-puller
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
      GARMIN_PULL_TIME: ${GARMIN_PULL_TIME:-06:30}
      BACKEND_HEALTH_SYNC_URL: ${BACKEND_HEALTH_SYNC_URL:-http://backend:8080/api/v1/health/sync}
      API_SECRET_KEY: ${API_SECRET_KEY:-changeme-strong-secret}
    volumes:
      - garmin_tokens:/root/.garminconnect

volumes:
  postgres_data:
  backend_logs:
  garmin_tokens:
